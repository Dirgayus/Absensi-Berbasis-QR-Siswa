services:
  - type: web
    name: absensi-qr-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_CA_CERT
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: PORT
        value: 3000
